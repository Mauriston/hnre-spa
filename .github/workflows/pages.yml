name: Atualizar dados do painel

# O GitHub Pages publica a partir da branch main: cada commit do snapshot
# dispara a republicação automática do site.
on:
  schedule:
    - cron: '17 * * * *' # de hora em hora
  workflow_dispatch:
  repository_dispatch:
    types: [atualizar-dados] # disparado pelo Apps Script ao editar a planilha

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      PA_EXPORT_URL: ${{ secrets.PA_EXPORT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar configuração
        if: ${{ env.PA_EXPORT_URL == '' }}
        run: echo "::warning::Segredo PA_EXPORT_URL não configurado — veja apps-script/README.md"

      - name: Baixar dados da planilha
        if: ${{ env.PA_EXPORT_URL != '' }}
        run: |
          curl -fsSL --retry 3 --retry-delay 5 "$PA_EXPORT_URL" -o "$RUNNER_TEMP/export.json"
          node scripts/build-pa-data.mjs "$RUNNER_TEMP/export.json" data/pa-data.js

      - name: Registrar snapshot no repositório
        run: |
          if ! git diff --quiet -- data/pa-data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pa-data.js
            git commit -m "dados: atualiza snapshot do PA ($(date -u +%Y-%m-%d))"
            git push
          fi
